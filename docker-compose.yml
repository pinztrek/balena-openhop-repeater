version: '2.1'

# Systemd-managed build -- see docs/systemd.md. This is the default compose
# file on the `systemd` branch; the pre-systemd compose file/Dockerfile are
# kept as docker-compose.classic.yml / Dockerfile.classic.template for
# reference/rollback.

services:
  openhop-repeater:
    build:
      context: .
      args:
        TARGET_HASH: "origin/dev"
    privileged: true
    cap_add:
      - SYS_RAWIO
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/gpiochip0:/dev/gpiochip0"
    ports:
      - "8000:8000"
      - "8080:8080"
      - "2222:22" #allow inbound ssh
    labels:
      io.balena.features.dbus: '1'
      io.balena.features.supervisor-api: '1'
      io.balena.features.balena-api: '1'
      # Balena uses this label to enable GPIO access
      io.balena.features.gpio: '1'
    volumes:
      - config:/etc/openhop_repeater
      - data:/var/lib/openhop_repeater
    # systemd requires /run and /run/lock as tmpfs. /tmp is tmpfs'd too, and
    # journald is deliberately left in its default volatile-only mode (no
    # /var/log/journal directory created, so it logs to /run/log/journal)
    # -- both cut the constant small writes systemd/journald otherwise
    # makes on the SD card/eMMC down to nothing. Actual state that must
    # survive a restart (config.yaml, the repeater.db, lorascan's scan
    # databases) stays on the config/data volumes above, not tmpfs.
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    group_add:
      - "plugdev"
      - "gpio"
    restart: always

volumes:
  config:
  data:
