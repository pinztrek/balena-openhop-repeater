- name: MeshMapper
  enabled: true
  transport: websockets
  host: mqtt.meshmapper.net
  port: 443
  format: letsmesh
  disallowed_packet_types: []
  retain_status: false
  tls:
    enabled: true
    insecure: false
  use_jwt_auth: true
  audience: mqtt.meshmapper.net
- name: LetsMesh (US West)
  enabled: true
  transport: websockets
  host: mqtt-us-v1.letsmesh.net
  port: 443
  format: letsmesh
  disallowed_packet_types: []
  retain_status: false
  tls:
    enabled: true
    insecure: false
  use_jwt_auth: true
  audience: mqtt-us-v1.letsmesh.net
- name: waev
  enabled: true
  host: mqtt.waev.app
  port: 443
  transport: websockets
  audience: mqtt.waev.app
  use_jwt_auth: true
  format: waev
  tls:
    enabled: true
    insecure: false
